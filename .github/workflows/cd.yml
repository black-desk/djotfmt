name: Continuous Deployment

on:
  workflow_call:

jobs:
  release:
    concurrency:
      group: djotls-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/goreleaser@master
        with:
          publish-crate: "true"
