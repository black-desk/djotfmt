[package]
name = "djotls"
default-run = "djotfmt"
version = "0.2.0-rc.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A Djot toolkit with a formatter and language server"
repository = "https://github.com/black-desk/djotls"
readme = "README.md"
keywords = ["djot", "formatter", "lsp"]
categories = ["command-line-utilities", "text-processing"]
exclude = [".format/**"]

[dependencies]
url = "2"
percent-encoding = "2"
serde_json = "1"
tower-lsp-server = "=0.23.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
clap = { version = "4.6.1", features = ["derive"] }
colog = "1.4.0"
env_logger = "0.11.10"
log = "0.4.32"
regex = "1"
lazy_static = "1"
roman = "0.2.0"
unicode-width = "0.2.2"

[dev-dependencies]
glob = "0.3"
libtest-mimic = "0.8"
pretty_assertions = "1.4.1"
regex = "1"

[[test]]
name = "fmt_test"
harness = false

[[test]]
name = "parser_events_test"
harness = false
